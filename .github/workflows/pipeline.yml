name: Salgsrutine

# Kjører lead-rutinen gratis på GitHub sine maskiner.
on:
  # Hver time på ukedager kl. 06–13 UTC (≈ 08–15 norsk tid). Hver kjøring
  # sender en liten bunt (SEND_PER_RUN), så e-postene drypper jevnt utover
  # dagen i stedet for å gå ut i klynge – mye snillere mot søppelpost-filtre.
  schedule:
    - cron: "0 6-13 * * 1-5"
  # Kjør manuelt fra Actions-fanen. Huk av "live" for å faktisk sende.
  workflow_dispatch:
    inputs:
      live:
        description: "Send på ekte (krever SMTP-secrets)"
        type: boolean
        default: false

# Hindrer at to kjøringer overlapper og roter til databasen.
concurrency:
  group: salgsrutine
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Tar vare på data/ (lead-databasen) mellom kjøringer, slik at vi ikke
      # kontakter samme bedrift på nytt. Ny cache hver kjøring, gjenoppretter
      # den nyeste forrige via restore-keys.
      - name: Gjenopprett database
        uses: actions/cache@v4
        with:
          path: data
          key: salgsdata-${{ github.run_id }}
          restore-keys: |
            salgsdata-

      - run: npm ci

      - name: Kjør rutinen
        env:
          TZ: Europe/Oslo
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          IMAP_HOST: ${{ secrets.IMAP_HOST }}
          IMAP_PORT: ${{ secrets.IMAP_PORT }}
          IMAP_USER: ${{ secrets.IMAP_USER }}
          IMAP_PASS: ${{ secrets.IMAP_PASS }}
          BOOKING_URL: ${{ secrets.BOOKING_URL }}
          COMPANY_POSTAL_ADDRESS: ${{ secrets.COMPANY_POSTAL_ADDRESS }}
          DAILY_SEND_LIMIT: ${{ vars.DAILY_SEND_LIMIT || '40' }}
          SEND_PER_RUN: ${{ vars.SEND_PER_RUN || '5' }}
          SEND_WINDOW_START: ${{ vars.SEND_WINDOW_START || '8' }}
          SEND_WINDOW_END: ${{ vars.SEND_WINDOW_END || '15' }}
        run: |
          # Sender ekte hvis du startet manuelt med "live", ELLER hvis du har
          # satt repository-variabelen SEND_LIVE=true (for autopilot på timeplan).
          # Ellers tørrkjøring (trygt som standard).
          if [ "${{ inputs.live }}" = "true" ] || [ "${{ vars.SEND_LIVE }}" = "true" ]; then
            npm start -- --live
          else
            npm start
          fi
